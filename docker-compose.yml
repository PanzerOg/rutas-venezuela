services:
  db:
    image: postgres:16.4-alpine
    container_name: rutas_venezuela_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Caracas
      PGTZ: America/Caracas
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./database:/database_scripts:ro

volumes:
  postgres_data:
